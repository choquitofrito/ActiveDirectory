site_name: Active Directory Course
site_url: https://activedirectory.pokeplot.com
repo_url: https://github.com/choquitofrito/ActiveDirectory
repo_name: choquitofrito/ActiveDirectory



# Configuración para archivos estáticos (diagramas)
extra_css:
  - stylesheets/extra.css

# Incluir archivos estáticos desde la carpeta diagrams
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choquitofrito/ActiveDirectory

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  icon:
    logo: material/domain
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy  # Habilita el botón de copia para bloques de código

plugins:
  - search
  - glightbox

# Exclure les guides instructeur du site publié (restent dans le repo)
exclude_docs: |
  Labos Extra/*/instructeur/
  instructeur/
  # Projet final masqué en attendant relecture
  Labo et Exercices/Projet_Final.md
  # Anatomie d'une ouverture de session masquée
  Labo et Exercices/Exercices: Anatomie_Logon_Reseau.md
  PowershellCourse/*prompt*.md
  PowershellCourse/cours-powershell-ad-moderne/README-*.md
  TODO.txt

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - attr_list
  # Scripts du lab : le code affiché dans la page est lu depuis le .ps1 téléchargeable (une seule source)
  - pymdownx.snippets:
      base_path: docs
      check_paths: true  # le build échoue si un fichier inclus est introuvable
      encoding: utf-8-sig  # les .ps1 sont en UTF-8 avec BOM : ne pas afficher le BOM dans la page


nav:
  - 🏠 Accueil: index.md

  - 🖥️ Fondations:
      - Ch1 - Introduction & Windows Server: Chapitre 1.Introduction et installation de Windows Server.md
      - Ch2 - Installation des VMs (VirtualBox): Chapitre 2.Installation-Windows-Server-2022-VirtualBox.md
      - ⚡ Guide Rapide - Installation AD-DS & Jonction au Domaine: Labo Annexe 1-Guide de base installation AD-DS.md
      - Ch3 - DNS pour AD: Chapitre 3.DNS.md
      - Ch4 - Active Directory Domain Services: Chapitre 4.Active Directory Domain Services (AD DS).md
      - Ch5 - DNS avec AD: Chapitre 5.DNS-Pratique-avec-AD.md
      - Référence - DNS Concepts Avancés: Théorie DNS- DNS Concepts Avances (Reference).md
      - Annexe - Ouverture de session sur un DC: Labo Annexe 2(opt)- Accès local à Windows Server.md

