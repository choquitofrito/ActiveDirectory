site_name: Active Directory Course
site_url: https://choquitofrito.github.io/ActiveDirectory
repo_url: https://github.com/choquitofrito/ActiveDirectory
repo_name: choquitofrito/ActiveDirectory



# Configuración para archivos estáticos (diagramas)
extra_css:
  - stylesheets/extra.css

# Incluir archivos estáticos desde la carpeta diagrams
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choquitofrito/ActiveDirectory

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy  # Habilita el botón de copia para bloques de código
  navigation:
    collapse: true
    collapse_sections: true
    show_ancestors: true

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition


nav:
