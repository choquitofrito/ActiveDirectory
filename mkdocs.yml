site_name: Active Directory Course
site_url: https://activedirectory.pokeplot.com
repo_url: https://github.com/choquitofrito/ActiveDirectory
repo_name: choquitofrito/ActiveDirectory



# Configuración para archivos estáticos (diagramas)
extra_css:
  - stylesheets/extra.css

# Incluir archivos estáticos desde la carpeta diagrams
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choquitofrito/ActiveDirectory

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  icon:
    logo: material/domain
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy  # Habilita el botón de copia para bloques de código

plugins:
  - search
  - glightbox

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition


nav:
  - 🏠 Accueil: index.md

  - 🖥️ Windows Server:
      - Ch1 - Introduction & Installation: Chapitre 1.Introduction et installation de Windows Server.md
